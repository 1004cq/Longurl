# Example Nginx reverse proxy for one alternate backend.
# Choose ONE backend port from docker-compose.example.yml:
# Go 8081, Python 8082, Node 8083, Rust 8084, Java 8085, C# 8086.

location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}

# Useful when serving very long e paths.
large_client_header_buffers 8 32k;
client_header_buffer_size 16k;
