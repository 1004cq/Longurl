name: Multilang check

on:
  pull_request:
    paths:
      - "implementations/**"
      - ".github/workflows/multilang-check.yml"
  push:
    branches: [main]
    paths:
      - "implementations/**"
      - ".github/workflows/multilang-check.yml"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m py_compile app.py

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -q -DskipTests package

  csharp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet build -c Release
