# EEEE: PHP site + optional Go redirect sidecar
# BaoTa: paste into 伪静态. Site root must stay public/.
#
# Start Go first:
#   PORT=8081 BASE_URL=https://your-domain.example \
#   DB_HOST=127.0.0.1 DB_NAME=eeee_longurl DB_USER=eeee_user DB_PASS=CHANGE_ME \
#   ./longurl-go
#
# If Go is down, comment out the first location so PHP handles redirects again.

location ~ "^/e+$" {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~* \.(?:css|js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Put these in the site server {} block if the panel allows it:
# large_client_header_buffers 8 32k;
# client_header_buffer_size 16k;
