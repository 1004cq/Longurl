# EEEE Long URL rewrite rules
#
# Website root MUST point to this project's public/ directory.
# For BaoTa/BT Panel, paste this into the site's "伪静态" section.
# Do NOT duplicate the panel-managed PHP/FastCGI location block.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# If you enable very long paths (for example 1000-5000 e's), add these
# directives to the site's server {} block if your panel allows it:
#
# large_client_header_buffers 8 32k;
# client_header_buffer_size 16k;
