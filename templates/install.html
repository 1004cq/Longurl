<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEEE Installer</title><style>body{margin:0;background:#07090d;color:#eef2f7;font-family:system-ui;min-height:100vh}.box{width:min(760px,calc(100% - 28px));margin:40px auto;padding:24px;border:1px solid #252c38;background:#10141b;border-radius:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:6px;color:#aab3bf}input{padding:12px;border-radius:10px;border:1px solid #303846;background:#080b10;color:#eef2f7;font:inherit}button{margin-top:18px;padding:13px 18px;border:0;border-radius:11px;background:#eef2f7;color:#080b10;font-weight:700;cursor:pointer}.err{padding:12px;border-radius:10px;background:#351313;color:#ffb3b3;margin:12px 0}.ok{padding:12px;border-radius:10px;background:#12301c;color:#aff0c0;margin:12px 0}.full{grid-column:1/-1}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="box"><h1>EEEE Go Installer</h1><p>配置 MySQL、站点地址和管理员密码。安装完成后 PHP 不参与运行。</p>{{if .Error}}<div class="err">{{.Error}}</div>{{end}}{{if .Success}}<div class="ok">安装完成。<a href="/admin/login">进入后台</a></div>{{else}}<form method="post"><input type="hidden" name="_token" value="{{.Token}}"><div class="grid"><label>DB Host<input name="db_host" value="{{.DBHost}}" required></label><label>DB Port<input name="db_port" value="{{.DBPort}}" required></label><label>DB Name<input name="db_name" value="{{.DBName}}" required></label><label>DB User<input name="db_user" value="{{.DBUser}}" required></label><label class="full">DB Password<input type="password" name="db_pass" required></label><label class="full">Website URL<input name="base_url" value="{{.BaseURL}}" placeholder="https://example.com" required></label><label class="full">Admin Password<input type="password" name="admin_password" minlength="10" required></label></div><button>Install EEEE</button></form>{{end}}</main></body></html>
