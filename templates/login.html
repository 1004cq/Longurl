<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>管理员登录 · EEEE</title>
<link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="login-page">
  <main class="login-box">
    <div class="brand"><span class="brand-mark">E</span><span>EEEE 控制台</span></div>
    <h1>管理员登录</h1>
    <p class="lead">登录后管理短链接、查看访问数据和调整站点设置。</p>
    {{if .Error}}<div class="err" role="alert">{{.Error}}</div>{{end}}
    <form method="post">
      <label class="login-label" for="password">管理员密码</label>
      <input class="input" id="password" type="password" name="password" placeholder="请输入管理员密码" autocomplete="current-password" autofocus required>
      <button class="btn primary" type="submit">安全登录</button>
    </form>
    <p class="login-foot">请勿在公共设备上保存登录信息</p>
  </main>
</body>
</html>
