<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EEEE Admin Login</title><style>body{margin:0;background:#07090d;color:#eef2f7;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 28px));padding:24px;border:1px solid #252c38;background:#10141b;border-radius:20px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:11px;border:1px solid #303846;background:#080b10;color:#eef2f7;font:inherit}button{margin-top:12px;background:#eef2f7;color:#080b10;cursor:pointer}.err{color:#ffaaaa;margin:10px 0}</style></head><body><form class="box" method="post"><h1>EEEE Admin</h1><p>Go administration console</p>{{if .Error}}<div class="err">{{.Error}}</div>{{end}}<input type="password" name="password" placeholder="Admin password" autofocus required><button>Sign in</button></form></body></html>
